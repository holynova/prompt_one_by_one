<svg xmlns="http://www.w3.org/2000/svg"
     width="1200" height="360" viewBox="0 0 1200 360"
     role="img" aria-labelledby="title desc">
  <title id="title">批量生图插件 Prompt One by One — Gemini / ChatGPT / Grok 批量作图</title>
  <desc id="desc">深紫底标题：批量生图插件，副标题提示词逐条自动发送；右侧是一张侧边栏示意卡：三条提示词队列（浮世绘已完成、赛博朋克进行中、水彩排队中）与三分之二的进度条。</desc>

  <rect width="1200" height="360" rx="26" fill="#191423"/>

  <g id="deco" opacity="0.8">
    <circle cx="700" cy="58" r="5" fill="#a78bfa"/>
    <circle cx="728" cy="84" r="3" fill="#7c3aed"/>
    <circle cx="676" cy="96" r="3" fill="#a78bfa"/>
    <circle cx="64" cy="322" r="4" fill="#7c3aed"/>
    <circle cx="88" cy="322" r="2.5" fill="#a78bfa"/>
  </g>

  <g id="title-block" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <text x="56" y="62" font-size="19" letter-spacing="3" fill="#a78bfa">CHROME 扩展 · MV3 · 批量生图</text>
    <text x="56" y="130" font-size="60" font-weight="700" fill="#f5f3ff">批量生图插件</text>
    <text x="56" y="170" font-size="23" fill="#c4b5fd">PROMPT ONE BY ONE — Gemini / ChatGPT / Grok</text>
    <text x="56" y="206" font-size="19" fill="#a1a1aa">提示词逐条自动发送，进度、计时、日志一目了然。</text>
    <g id="chips" font-size="18" fill="#e9d5ff" text-anchor="middle">
      <g><rect x="56" y="238" width="150" height="36" rx="18" fill="#2e2450" stroke="#4c3a78" stroke-width="1.5"/><text x="131" y="262">64 个预设风格</text></g>
      <g><rect x="218" y="238" width="112" height="36" rx="18" fill="#2e2450" stroke="#4c3a78" stroke-width="1.5"/><text x="274" y="262">三站通用</text></g>
      <g><rect x="342" y="238" width="150" height="36" rx="18" fill="#2e2450" stroke="#4c3a78" stroke-width="1.5"/><text x="417" y="262">ZIP 原图归档</text></g>
      <g><rect x="504" y="238" width="84" height="36" rx="18" fill="#2e2450" stroke="#4c3a78" stroke-width="1.5"/><text x="546" y="262">v2.3</text></g>
    </g>
  </g>

  <g id="queue-card" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif">
    <rect x="800" y="44" width="344" height="272" rx="16" fill="#241d33" stroke="#3d3352" stroke-width="1.5"/>
    <text x="828" y="80" font-size="18" fill="#c4b5fd">批量作图队列</text>
    <g id="row1"><rect x="824" y="96" width="296" height="40" rx="8" fill="#2f2545"/><text x="840" y="122" font-size="18" fill="#e5e7eb">✓ 浮世绘风格 · 已完成 42s</text></g>
    <g id="row2"><rect x="824" y="144" width="296" height="40" rx="8" fill="#2f2545"/><text x="840" y="170" font-size="18" fill="#e5e7eb">● 赛博朋克风格 · 生成中</text></g>
    <g id="row3"><rect x="824" y="192" width="296" height="40" rx="8" fill="#2f2545"/><text x="840" y="218" font-size="18" fill="#9ca3af">○ 水彩插画风格 · 排队中</text></g>
    <text x="828" y="262" font-size="18" fill="#c4b5fd">已完成 2 / 3 · 平均 48 秒</text>
    <g id="progress">
      <rect x="824" y="276" width="296" height="10" rx="5" fill="#3d3352"/>
      <rect x="824" y="276" width="197" height="10" rx="5" fill="#a78bfa"/>
    </g>
  </g>
</svg>
