<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prompt One by One</title>
    <style>
      :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #111827; color: #e5e7eb; }
      main { width: min(680px, calc(100% - 40px)); padding: 40px; border: 1px solid #374151; border-radius: 20px; background: #1f2937; box-sizing: border-box; }
      .kicker { margin: 0 0 12px; color: #a78bfa; font-size: 12px; letter-spacing: .12em; text-transform: uppercase; }
      h1 { margin: 0 0 16px; font-size: clamp(32px, 7vw, 56px); line-height: 1; }
      p, li { color: #cbd5e1; line-height: 1.7; }
      ul { padding-left: 22px; }
      nav { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 28px; }
      a { padding: 10px 14px; border-radius: 10px; color: #fff; background: #7c3aed; text-decoration: none; }
      a.secondary { background: #374151; }
    </style>
  </head>
  <body>
    <main>
      <p class="kicker">Chrome Extension</p>
      <h1>Prompt One by One</h1>
      <p>Gemini 批量生图插件：逐条执行提示词队列，并提供前缀/后缀、进度、计时与日志功能。</p>
      <ul>
        <li>在 Gemini 页面侧边栏运行批量提示词</li>
        <li>记录生成进度与每条提示词的耗时</li>
        <li>完整扩展文件可直接从本地址访问</li>
      </ul>
      <nav>
        <a href="README.md">安装说明</a>
        <a class="secondary" href="https://github.com/holynova/prompt_one_by_one">GitHub 仓库</a>
      </nav>
    </main>
  </body>
</html>
